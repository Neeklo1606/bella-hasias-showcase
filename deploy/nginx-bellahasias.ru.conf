server {
    listen 80;
    listen [::]:80;
    server_name bellahasias.ru www.bellahasias.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://bellahasias.ru$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bellahasias.ru;
    ssl_certificate     /etc/letsencrypt/live/bellahasias.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bellahasias.ru/privkey.pem;
    return 301 https://bellahasias.ru$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bellahasias.ru;
    ssl_certificate     /etc/letsencrypt/live/bellahasias.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bellahasias.ru/privkey.pem;
    include snippets/security-headers.conf;
    root /var/www/bella-hasias-showcase;
    index index.php;
    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/manifest+json image/svg+xml image/x-icon;

    # --- Закрываем исходники, служебные файлы и репозиторий ---
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(md|sh|lock|lockb|phar|ts|tsx|log|sql|env|yml|yaml|bak)$ { deny all; return 404; }
    location ~ ^/(laravel|frontend|src|public|dist|node_modules|vendor|docs|deploy)(/|$) { deny all; return 404; }
    location ~ ^/(package(-lock)?\.json|composer\.(json|lock)|tsconfig[^/]*\.json|components\.json|eslint\.config\.js|postcss\.config\.js|tailwind\.config\.ts|vite\.config\.ts|index\.html)$ { deny all; return 404; }

    # --- Статика сборки: хешированные файлы кэшируем навсегда ---
    location ^~ /build/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/security-headers.conf;
        try_files $uri =404;
    }
    location = /build/manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
        include snippets/security-headers.conf;
    }
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=604800";
        include snippets/security-headers.conf;
        try_files $uri =404;
    }
    # Загрузки из админки (storage/app/public) без симлинка
    location ^~ /storage/ {
        alias /var/www/bella-hasias-showcase/laravel/storage/app/public/;
        add_header Cache-Control "public, max-age=2592000";
        include snippets/security-headers.conf;
        location ~ \.(php|phtml|phar)$ { deny all; return 404; }
    }

    # Файлы из frontend/public, на которые код ссылается от корня (/logo3.png, /videos/..., /favicon.ico)
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|mp4|webm|webmanifest|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        include snippets/security-headers.conf;
        try_files $uri /build$uri =404;
    }

    location / { try_files $uri /index.php?$query_string; }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { deny all; return 404; }
}
